name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md and docs/ARCHITECTURE.md first;
            they define the Phase 1 scope and the invariants that matter here.

            Focus on, in priority order:
            1. Correctness bugs: normalization edge cases, timezone handling, hash field
               order, anything that would change content_hash for existing spots, SQL
               that could fail on the hosted project.
            2. Scope creep: anything the Phase 1 exclusions in docs/ARCHITECTURE.md say
               not to build.
            3. Secrets or credentials in migrations, scripts, or workflows.
            4. Missing tests for new or changed normalization logic.

            Use inline comments for specific lines and one summary comment for the overall
            verdict. Be concise. Do not comment on style that deno fmt and deno lint
            already enforce.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(deno test:*),Bash(deno check:*)"
